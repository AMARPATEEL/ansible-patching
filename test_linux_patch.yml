---
- name: Patch Linux servers (test)
  hosts: all
  become: yes
  gather_facts: yes
  tasks:
    - name: Patch Debian/Ubuntu
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Patch RHEL/Amazon Linux
      ansible.builtin.yum:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"
      ignore_errors: yes

    - name: Patch SUSE
      community.general.zypper:
        name: "*"
        state: latest
        update_cache: yes
      when: ansible_os_family == "Suse"
      ignore_errors: yes
